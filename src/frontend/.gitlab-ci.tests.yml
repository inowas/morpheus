test-frontend:
  image: node:20
  stage: "test (unit)"

  script:
    - cd src/frontend
    - make install-ci
    - make test-ci

  only:
    changes:
      - src/frontend/**/*.*

test-frontend-dependencies:
  image: node:20
  stage: "test (unit)"
  script:
    - cd src/frontend
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline
    - npm run depcruise:all
  only:
    changes:
      - src/frontend/**/*.*

test-frontend-storybook:
  image: mcr.microsoft.com/playwright:v1.44.1-jammy
  stage: "test (unit)"
  script:
    - cd src/frontend
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline
    - npm run build-storybook
    - python3 -m http.server 6006 --directory dist/storybook > storybook.log 2>&1 &
    - until curl --fail --silent http://127.0.0.1:6006 >/dev/null; do sleep 1; done
    - npm run test-storybook -- --url http://127.0.0.1:6006 --maxWorkers 1 --testTimeout 60000 --includeTags behavior
  artifacts:
    when: on_failure
    paths:
      - src/frontend/dist/storybook
      - src/frontend/storybook.log
    expire_in: 1 day
  only:
    changes:
      - src/frontend/**/*.*

test-frontend-e2e:
  image: mcr.microsoft.com/playwright:v1.44.1-jammy
  stage: "test (integration)"
  script:
    - cd src/frontend
    - make install-ci
    - npm run build-morpheus
    - npm run test:e2e:playwright
  artifacts:
    when: on_failure
    paths:
      - src/frontend/test-results
      - src/frontend/reports
    expire_in: 1 day
  only:
    changes:
      - src/frontend/**/*.*

test-frontend-visual:
  image: mcr.microsoft.com/playwright:v1.44.1-jammy
  stage: "test (integration)"
  script:
    - cd src/frontend
    - make install-ci
    - npm run build-storybook
    - npm run test:visual
  artifacts:
    when: on_failure
    paths:
      - src/frontend/test-results
      - src/frontend/reports
    expire_in: 1 day
  only:
    changes:
      - src/frontend/**/*.*
