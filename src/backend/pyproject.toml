[project]
name = "morpheus-backend"
version = "1.0.0"
description = "Morpheus groundwater modeling backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "authlib>=1.7,<2",
  "dynaconf>=3.3,<4",
  "sentry-sdk>=2.13,<3",
  "sqlalchemy>=2.0,<3",
  "celery>=5.3,<6",
  "fastapi>=0.115,<1",
  "flopy>=3.8,<3.9",
  "fqdn>=1.5,<2",
  "geopandas>=1.1,<2",
  "geotiff>=0.2,<0.3",
  "gunicorn>=26,<27",
  "inflection>=0.5,<0.6",
  "isoduration>=20.11,<21",
  "jsonpointer>=3.1,<4",
  "numcodecs>=0.15,<0.16",
  "pandas>=2.2,<3",
  "pillow>=12,<13",
  "psycopg2-binary>=2.9,<3",
  "pyarrow>=25,<26",
  "pydantic>=2.13,<3",
  "pygeoif>=1.6,<2",
  "pymongo>=4.17,<5",
  "pyproj>=3.7,<4",
  "python-keycloak>=7.1,<8",
  "python-magic>=0.4,<0.5",
  "python-multipart>=0.0.32,<0.1",
  "rfc3987-syntax>=1.1,<2",
  "scipy>=1.14,<2",
  "shapely>=2.0,<3",
  "simplejson>=3.19,<4",
  "tifffile>=2023.0.0,<2024.8.0",
  "uri-template>=1.3,<2",
  "uvicorn>=0.52,<1",
  "webcolors>=25,<26",
  "werkzeug>=3.1,<4",
  "zarr>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "basedpyright",
  "dep-check",
  "folium",
  "jupyter",
  "jupyterlab",
  "matplotlib",
  "httpx",
  "papermill",
  "pytest",
  "ruff"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morpheus"]

[tool.uv]
# Ensure uv installs MODFLOW binaries
# Note: get-modflow command still needed after install

[tool.uv.sources]
# If you need to use local packages or git repos, configure them here

[tool.basedpyright]
include = ["src/morpheus"]
exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  "**/notebooks/*",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
ignore = []
reportAny = false
reportMissingImports = "error"
reportMissingTypeStubs = false
pythonPlatform = "Linux"
executionEnvironments = [
  { root = "src" }
]

[tool.ruff]
line-length = 180
include = ["src/morpheus/**/*.py", "src/tests/**/*.py", "src/*.py"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]

# Disable rules that overlap/conflict with formatting:
ignore = [
  # indentation (formatter owns this)
  "W191", # tab-indentation
  "E111", # indentation-with-invalid-multiple
  "E114", # indentation-with-invalid-multiple-comment
  "E117", # over-indented

  # docstring/quote style (formatter owns this)
  "D206", # docstring-tab-indentation
  "D300", # triple-single-quotes
  "Q000", # bad-quotes-inline-string
  "Q001", # bad-quotes-multiline-string
  "Q002", # bad-quotes-docstring
  "Q003", # avoidable-escaped-quote

  # trailing-comma rules (formatter owns this)
  "COM812", # missing-trailing-comma
  "COM819", # prohibited-trailing-comma
]
