variables:
  MORPHEUS_BACKEND_API_IMAGE: inowas/morpheus-backend-api
  MORPHEUS_BACKEND_TASK_QUEUE_WORKER_IMAGE: inowas/morpheus-backend-task-queue-worker
  INOWAS_USER_ID: 1005
  INOWAS_GROUP_ID: 1004


test-morpheus-backend-integration:
  image: python:3.12-bookworm
  stage: test
  services:
    - name: mongo:7.0
      alias: mongodb_backend
  variables:
    BACKEND_SECRET_KEY: test-secret-key-for-gitlab
    BACKEND_MAX_CONTENT_LENGTH: '104857600'
    BACKEND_KEYCLOAK_CLIENT_ID: test-client
    BACKEND_KEYCLOAK_CLIENT_SECRET: test-secret
    BACKEND_KEYCLOAK_REALM: test-realm
    BACKEND_KEYCLOAK_SERVER_URL: http://keycloak.invalid
    BACKEND_KEYCLOAK_MORPHEUS_ADMIN_ROLE: morpheus_admin
    BACKEND_MONGO_INITDB_ROOT_USERNAME: root
    BACKEND_MONGO_INITDB_ROOT_PASSWORD: dev-root
    BACKEND_MONGO_HOST: mongodb_backend
    BACKEND_MONGO_PORT: '27017'
    BACKEND_MONGO_USER: dev
    BACKEND_MONGO_PASSWORD: dev
    BACKEND_MONGO_PROJECT_DATABASE: morpheus_test_project
    BACKEND_MONGO_SENSOR_DATABASE: morpheus_test_sensor
    BACKEND_MONGO_USER_DATABASE: morpheus_test_user
    BACKEND_MORPHEUS_PROJECT_ASSET_DATA: /tmp/test/assets
    BACKEND_MORPHEUS_PROJECT_CALCULATION_DATA: /tmp/test/calculations
    BACKEND_MORPHEUS_SENSOR_LOCAL_DATA: /tmp/test/sensors
    BACKEND_MORPHEUS_SENSORS_UIT_FTP_HOST: ftp.invalid
    BACKEND_MORPHEUS_SENSORS_UIT_FTP_USER: test
    BACKEND_MORPHEUS_SENSORS_UIT_FTP_PASSWORD: test
    BACKEND_MORPHEUS_SENSORS_UIT_FTP_PATH: /test
    BACKEND_CELERY_BROKER: memory://
    BACKEND_CELERY_RESULT_BACKEND: cache+memory://
    FLASK_ENV: testing
  before_script:
    - pip install --no-cache-dir uv
    - uv sync --frozen --extra dev
    - until uv run python -c "from pymongo import MongoClient; MongoClient(host='mongodb_backend', port=27017, username='root', password='dev-root', authSource='admin').admin.command('ping')"; do sleep 2; done
  script:
    - uv run pytest src/tests/morpheus/project -m integration
  only:
    changes:
      - src/backend/src/**/*.py
      - src/backend/pyproject.toml
      - src/backend/pytest.ini
      - src/backend/uv.lock
    refs:
      - branches
      - tags



publish-morpheus-backend-api:dev:
  stage: publish
  before_script:
    - docker info
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin
  script:
    - DOCKER_BUILDKIT=1 docker build --build-arg="FLASK_USER_ID=$INOWAS_USER_ID" --build-arg="FLASK_GROUP_ID=$INOWAS_GROUP_ID" --target flask_app --tag $MORPHEUS_BACKEND_API_IMAGE:$CI_COMMIT_SHA --tag $MORPHEUS_BACKEND_API_IMAGE:dev --file src/backend/docker/flask.Dockerfile .
    - docker push $MORPHEUS_BACKEND_API_IMAGE:$CI_COMMIT_SHA
    - docker push $MORPHEUS_BACKEND_API_IMAGE:dev
  only:
    changes:
      - src/infrastructure/production/**/*.*
      - src/backend/docker/**/*.*
      - src/backend/src/**/*.*
      - src/backend/pyproject.toml
      - src/backend/uv.lock
    refs:
      - main
      - tags

publish-morpheus-backend-task-queue-worker:dev:
  stage: publish
  before_script:
    - docker info
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin
  script:
    - DOCKER_BUILDKIT=1 docker build --build-arg="CELERY_USER_ID=$INOWAS_USER_ID" --build-arg="CELERY_GROUP_ID=$INOWAS_GROUP_ID" --target celery_worker --tag $MORPHEUS_BACKEND_TASK_QUEUE_WORKER_IMAGE:$CI_COMMIT_SHA --tag $MORPHEUS_BACKEND_TASK_QUEUE_WORKER_IMAGE:dev --file src/backend/docker/celery.Dockerfile .
    - docker push $MORPHEUS_BACKEND_TASK_QUEUE_WORKER_IMAGE:$CI_COMMIT_SHA
    - docker push $MORPHEUS_BACKEND_TASK_QUEUE_WORKER_IMAGE:dev
  only:
    changes:
      - src/infrastructure/production/**/*.*
      - src/backend/docker/**/*.*
      - src/backend/src/**/*.*
      - src/backend/pyproject.toml
      - src/backend/uv.lock
    refs:
      - main
      - tags

